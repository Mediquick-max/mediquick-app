<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>MediQuick - Healthcare App</title>
    <meta name="description" content="Medicine reminders, doctor consultations, lab tests & medicine delivery" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MediQuick" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="MediQuick" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Pull-to-refresh block — body scroll container approach
      var _lastTouchY = 0;
      document.addEventListener('touchstart', function(e) {
        _lastTouchY = e.touches[0].clientY;
      }, { passive: true });
      document.body.addEventListener('touchmove', function(e) {
        var touchY = e.touches[0].clientY;
        var scrollTop = document.body.scrollTop || 0;
        if (scrollTop < 5 && touchY > _lastTouchY) {
          e.preventDefault();
        }
        _lastTouchY = touchY;
      }, { passive: false });
    </script>
  </body>
</html>
