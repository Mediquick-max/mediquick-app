<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Medi Quick</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Pull-to-refresh aur overscroll disable karo — Chrome Android + WebView
      document.addEventListener('touchmove', function(e) {
        var el = e.target;
        // Kisi scrollable element ke andar hain to allow karo
        while (el && el !== document.body) {
          var style = window.getComputedStyle(el);
          var overflowY = style.overflowY;
          var isScrollable = (overflowY === 'auto' || overflowY === 'scroll');
          if (isScrollable && el.scrollHeight > el.clientHeight) {
            return; // element scrollable hai — browser handle kare
          }
          el = el.parentElement;
        }
        // Body level par — prevent browser overscroll/refresh
        e.preventDefault();
      }, { passive: false });

      // Chrome Android "overscroll-refresh" extra block
      window.addEventListener('scroll', function() {}, { passive: true });
    </script>
  </body>
</html>
